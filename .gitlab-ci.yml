stages:
  - build

variables:
  # 使用淘宝镜像加速 npm 和 electron 下载（因为 LUG 服务器在国内）
  NPM_REGISTRY: "https://registry.npmmirror.com"
  ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
  ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

# ==========================================
# Linux 构建任务（使用 LUG 提供的公共 Docker Runner）
# ==========================================
build:linux:
  stage: build
  image: node:20-bullseye
  before_script:
    # 在容器中安装对应依赖和 ffmpeg
    - apt-get update && apt-get install -y ffmpeg zip unzip
    - mkdir -p ffmpeg-bin/linux
    - cp $(which ffmpeg) ffmpeg-bin/linux/
    - cp $(chroot / which ffprobe || which ffprobe) ffmpeg-bin/linux/ || true
    - npm config set registry $NPM_REGISTRY
  script:
    - npm ci
    - npm run build
    - npm run dist:linux
  artifacts:
    name: "MediaForge-Linux-$CI_COMMIT_SHORT_SHA"
    paths:
      - release/*.AppImage
      - release/*.deb
    expire_in: 1 week
  tags:
    # LUG 通常提供 docker 类型的 runner 给学生使用，如果没有特定 tag 可留空或写 docker
    - docker

# ==========================================
# macOS 构建任务 (⚠️ 警告：通常需要你自己接入 Mac 机器作为 Runner)
# ==========================================
build:macos:
  stage: build
  before_script:
    - mkdir -p ffmpeg-bin/darwin
    - brew install ffmpeg || echo "FFmpeg is already installed"
    - cp $(which ffmpeg) ffmpeg-bin/darwin/
    - cp $(which ffprobe) ffmpeg-bin/darwin/
  script:
    - npm ci
    - npm run build
    - npm run dist:mac
  artifacts:
    name: "MediaForge-macOS-$CI_COMMIT_SHORT_SHA"
    paths:
      - release/*.dmg
      - release/*.zip
    expire_in: 1 week
  tags:
    - macos # 注意：你必须在 GitLab 中为主机注册了打有此 tag 的 macOS Runner
  allow_failure: true # 允许失败，因为学校通常不提供公用 mac 机器

# ==========================================
# Windows 构建任务 (⚠️ 警告：同样需要你接入 Windows 机器作为 Runner)
# ==========================================
build:windows:
  stage: build
  before_script:
    - mkdir -p ffmpeg-bin/win32
    # Windows shell 下需要有 ffmpeg.exe 环境，或者预先放置好
    - cp $(where.exe ffmpeg.exe) ffmpeg-bin/win32/ || true
    - cp $(where.exe ffprobe.exe) ffmpeg-bin/win32/ || true
  script:
    - npm ci
    - npm run build
    - npm run dist:win
  artifacts:
    name: "MediaForge-Windows-$CI_COMMIT_SHORT_SHA"
    paths:
      - release/*.exe
      - release/*.zip
    expire_in: 1 week
  tags:
    - windows # 注意：你需要在 GitLab 配置一台打有 Windows 标签的专属机器
  allow_failure: true
