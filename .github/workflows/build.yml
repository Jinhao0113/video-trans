name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install FFmpeg (Windows & Linux)
        if: runner.os != 'macOS'
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Copy FFmpeg binaries
        run: |
          # Create the corresponding platform directory
          if [ "${{ runner.os }}" = "macOS" ]; then
            PLATFORM="mac"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            PLATFORM="win"
          else
            PLATFORM="linux"
          fi
          
          mkdir -p ffmpeg-bin/$PLATFORM
          
          # Copy binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp $(which ffmpeg.exe) ffmpeg-bin/$PLATFORM/
            cp $(which ffprobe.exe) ffmpeg-bin/$PLATFORM/
          else
            cp $(which ffmpeg) ffmpeg-bin/$PLATFORM/
            cp $(which ffprobe) ffmpeg-bin/$PLATFORM/
          fi
        shell: bash

      - name: Install dependencies
        run: npm ci

      - name: Build and Package
        run: |
          npm run build
          npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-${{ matrix.os }}-build
          path: |
            release/*.dmg
            release/*.exe
            release/*.deb
          retention-days: 7
