name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # Stage 1: Build on all three platforms
  # ─────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ── FFmpeg installation ──────────────────
      - name: Install FFmpeg (Windows & Linux)
        if: runner.os != 'macOS'
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      # ── Copy FFmpeg binaries into project ────
      - name: Copy FFmpeg binaries (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          PLATFORM="${{ matrix.platform }}"
          mkdir -p ffmpeg-bin/$PLATFORM
          cp "$(which ffmpeg)"  ffmpeg-bin/$PLATFORM/
          cp "$(which ffprobe)" ffmpeg-bin/$PLATFORM/

      - name: Copy FFmpeg binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "ffmpeg-bin\win"
          Copy-Item (Get-Command ffmpeg.exe).Source  "ffmpeg-bin\win\"
          Copy-Item (Get-Command ffprobe.exe).Source "ffmpeg-bin\win\"

      # ── Build & package ──────────────────────
      - name: Install dependencies
        run: npm ci

      - name: Build and Package
        run: |
          npm run build
          npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Upload per-platform artifacts ────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.deb
            release/*.AppImage
          if-no-files-found: warn
          retention-days: 7

  # ─────────────────────────────────────────────
  # Stage 2: Publish release (GitHub + USTC GitLab)
  # ─────────────────────────────────────────────
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout full history (for GitLab mirror)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 获取完整历史，确保能 push 到 GitLab

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release files
        run: ls -lh release-artifacts/

      # ── Publish to GitHub Release ─────────────
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/*.dmg
            release-artifacts/*.exe
            release-artifacts/*.deb
            release-artifacts/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Mirror code + tag to USTC GitLab ─────
      # 必须先把代码推到 GitLab，tag 才存在，release 才能创建
      - name: Mirror repository to USTC GitLab
        if: ${{ env.USTC_GITLAB_TOKEN != '' }}
        env:
          USTC_GITLAB_TOKEN: ${{ secrets.USTC_GITLAB_TOKEN }}
        run: |
          echo "🔀 Pushing code and tags to USTC GitLab..."
          git remote add gitlab \
            "https://oauth2:${USTC_GITLAB_TOKEN}@git.lug.ustc.edu.cn/jinhao_hu/video-trans.git"

          # Push all branches and all tags
          git push gitlab --all --force
          git push gitlab --tags --force
          echo "✅ Mirror push complete."

      # ── Create GitLab Release & upload assets ─
      - name: Create GitLab Release and upload assets
        if: ${{ env.USTC_GITLAB_TOKEN != '' }}
        env:
          USTC_GITLAB_TOKEN: ${{ secrets.USTC_GITLAB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          GITLAB_HOST: git.lug.ustc.edu.cn
          # URL-encoded "jinhao_hu/video-trans"
          GITLAB_PROJECT: jinhao_hu%2Fvideo-trans
        run: |
          set -euo pipefail

          API="https://${GITLAB_HOST}/api/v4/projects/${GITLAB_PROJECT}"
          AUTH="-H \"PRIVATE-TOKEN: ${USTC_GITLAB_TOKEN}\""

          call_api() {
            curl -sf \
              -H "PRIVATE-TOKEN: ${USTC_GITLAB_TOKEN}" \
              "$@"
          }

          # ── 1. Create or update Release ──────────────────────────────────────
          echo "📦 Creating GitLab Release ${TAG_NAME}..."
          HTTP=$(curl -s -o /tmp/gl_release.json -w "%{http_code}" \
            -X POST "${API}/releases" \
            -H "PRIVATE-TOKEN: ${USTC_GITLAB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"tag_name\": \"${TAG_NAME}\",
              \"name\": \"Release ${TAG_NAME}\",
              \"description\": \"Auto-published from GitHub Actions.\nIncludes compiled installers for macOS (.dmg), Windows (.exe) and Linux (.deb).\"
            }")

          case "$HTTP" in
            201) echo "✅ Release created (201)." ;;
            409)
              echo "ℹ️  Release already exists (409) — updating description..."
              call_api -X PUT "${API}/releases/${TAG_NAME}" \
                -H "Content-Type: application/json" \
                -d "{\"description\": \"Auto-published from GitHub Actions.\nIncludes compiled installers for macOS (.dmg), Windows (.exe) and Linux (.deb).\"}" \
                -o /dev/null
              ;;
            *)
              echo "❌ Unexpected HTTP ${HTTP} when creating release:"
              cat /tmp/gl_release.json
              exit 1
              ;;
          esac

          # ── 2. Upload binaries as release asset links ─────────────────────────
          upload_asset() {
            local FILE="$1"
            local BASENAME
            BASENAME=$(basename "$FILE")
            echo ""
            echo "⬆️  Uploading ${BASENAME}..."

            # Upload file to project storage
            local UPLOAD_JSON
            UPLOAD_JSON=$(call_api \
              -X POST "${API}/uploads" \
              -F "file=@${FILE}")

            # GitLab returns: {"full_path": "/jinhao_hu/video-trans/uploads/.../filename", ...}
            local FULL_PATH
            FULL_PATH=$(echo "$UPLOAD_JSON" | python3 -c \
              "import sys,json; print(json.load(sys.stdin)['full_path'])")

            local ASSET_URL="https://${GITLAB_HOST}${FULL_PATH}"
            echo "   File available at: ${ASSET_URL}"

            # Attach as a named release link
            local LINK_HTTP
            LINK_HTTP=$(curl -s -o /tmp/gl_link.json -w "%{http_code}" \
              -X POST "${API}/releases/${TAG_NAME}/assets/links" \
              -H "PRIVATE-TOKEN: ${USTC_GITLAB_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{
                \"name\": \"${BASENAME}\",
                \"url\": \"${ASSET_URL}\",
                \"link_type\": \"package\"
              }")

            if [ "$LINK_HTTP" = "201" ]; then
              echo "   ✅ Asset link created."
            else
              echo "   ⚠️  Asset link HTTP ${LINK_HTTP}:"
              cat /tmp/gl_link.json
            fi
          }

          FOUND=0
          for f in release-artifacts/*.dmg release-artifacts/*.exe \
                   release-artifacts/*.deb release-artifacts/*.AppImage; do
            if [ -f "$f" ]; then
              upload_asset "$f"
              FOUND=$((FOUND + 1))
            fi
          done

          echo ""
          echo "🎉 Done! ${FOUND} asset(s) attached to GitLab Release ${TAG_NAME}."
