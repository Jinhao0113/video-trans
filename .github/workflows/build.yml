name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install FFmpeg (Windows & Linux)
        if: runner.os != 'macOS'
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Copy FFmpeg binaries
        run: |
          # Create the corresponding platform directory
          if [ "${{ runner.os }}" = "macOS" ]; then
            PLATFORM="mac"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            PLATFORM="win"
          else
            PLATFORM="linux"
          fi
          
          mkdir -p ffmpeg-bin/$PLATFORM
          
          # Copy binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp $(which ffmpeg.exe) ffmpeg-bin/$PLATFORM/
            cp $(which ffprobe.exe) ffmpeg-bin/$PLATFORM/
          else
            cp $(which ffmpeg) ffmpeg-bin/$PLATFORM/
            cp $(which ffprobe) ffmpeg-bin/$PLATFORM/
          fi
        shell: bash

      - name: Install dependencies
        run: npm ci

      - name: Build and Package
        run: |
          npm run build
          npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-${{ matrix.os }}-build
          path: |
            release/*.dmg
            release/*.exe
            release/*.deb
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.dmg
            release-artifacts/*.exe
            release-artifacts/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to USTC GitLab Release
        env:
          GITLAB_TOKEN: ${{ secrets.USTC_GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "⚠️ USTC_GITLAB_TOKEN is not configured in GitHub Secrets."
            echo "Please add your GitLab Personal Access Token to sync releases."
            exit 0
          fi
          
          echo "📦 Installing official GitLab CLI (glab)..."
          curl -sL https://gitlab.com/gitlab-org/cli/-/releases/permalink/latest/downloads/glab_Linux_x86_64.tar.gz | sudo tar -xz -C /usr/local/bin -f - bin/glab --strip-components=1
          
          echo "🔐 Authenticating with git.lug.ustc.edu.cn..."
          export GITLAB_HOST=git.lug.ustc.edu.cn
          glab auth login --hostname $GITLAB_HOST --token $GITLAB_TOKEN
          
          echo "🚀 Creating official release on USTC GitLab..."
          glab release create ${{ github.ref_name }} release-artifacts/* \
            --repo jinhao_hu/video-trans \
            --name "Release ${{ github.ref_name }}" \
            --notes "Auto-published compiled binaries transferred from GitHub Actions." || echo "Already existed or failed."
